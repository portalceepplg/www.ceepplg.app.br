        <!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/css/style.css">

    <link rel="icon" type="image/png"
        href="https://i.ibb.co/rR9W2Zwj/Logotipo-ceep-em-azul-e-vermelho.png">

    <title>Portal CEEPPLG | Login Administrativo</title>
</head>

<body class="pagina-login login-adm" data-verificar-sessao="/php/status-sessao.php">

    <main class="login-container">

        <!-- LADO ESQUERDO: FORMULÁRIO -->
        <section class="login-lado">

            <a href="/index.html" class="voltar">
                ← Voltar
            </a>

            <div class="login-box">

                <img
                    src="https://i.ibb.co/vCK1m7DP/1786128151276.png"
                    alt="Logo CEEPPLG"
                    class="logo"
                >

                <!-- IDENTIFICAÇÃO DO ACESSO -->
                <div class="tipo-login">
                    <button
                        type="button"
                        id="btnAluno"
                        class="ativo"
                    >
                        <i class="fa-solid fa-user-gear"></i>
                        Gestão
                    </button>
                </div>

                <!-- FORMULÁRIO ADMINISTRATIVO -->
                <form
                    id="loginForm"
                    action="/php/loginadm.php"
                    method="POST"
                >   

                    <label for="usuario">Credencial Administrativa</label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Sua credencial"
                        autocomplete="username"
                        required
                    >

                    <label for="senha">Senha</label>

                    <div class="senha-container">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Sua senha"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="mostrarSenha"
                            aria-label="Mostrar senha"
                        >
                            <i class="fa-solid fa-eye"></i>
                        </button>

                    </div>

                    <button type="submit" class="btn-entrar">
                        Entrar
                        <i class="fa-solid fa-lock"></i>
                    </button>

                    <div
                        id="mensagemErro"
                        class="mensagem-erro"
                        role="alert"
                        aria-live="polite"
                    >
                        <i class="fa-solid fa-circle-exclamation"></i>
                        <span id="textoErro">
                            Credencial administrativa ou senha incorreta.
                        </span>
                    </div>

                </form>

                <!-- SEPARADOR -->
                <div class="separador">
                    <span></span>
                    <p>OU</p>
                    <span></span>
                </div>

                <!-- VOLTAR AO LOGIN DE ALUNO/PROFESSOR -->
                <a href="/paginas/entrar.html" class="btn-gestor">
                    Sou Aluno ou Professor
                </a>

            </div>

        </section>

        <!-- LADO DIREITO: IMAGEM -->
        <section class="imagem-lado">

            <div class="imagem-overlay"></div>

            <div class="texto-imagem"></div>

        </section>

    </main>

    <script src="/js/index.js"></script>

    

</body>
</html>
